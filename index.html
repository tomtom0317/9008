function nameFromPlace(){
 $("mode").innerHTML="① 赤い城の 都道府県名(とどうふけんめい)は？";$("qtext").innerHTML="🟥 地図の場所を見て 名前をえらぼう";$("hint").innerHTML="ちほう： "+current.region;
 var vals=[current.name],pool=[],i,v;for(i=0;i<PREFS.length;i++)if(PREFS[i].region===current.region&&PREFS[i].name!==current.name)pool.push(PREFS[i].name);
 while(vals.length<4){v=pool.length?pool[Math.floor(Math.random()*pool.length)]:PREFS[Math.floor(Math.random()*PREFS.length)].name;if(vals.indexOf(v)<0)vals.push(v)}
 shuffle(vals);makeAnswerButtons(vals,current.name);
}
function placeFromName(){
 $("mode").innerHTML="② 都道府県名から 場所をさがそう";$("qtext").innerHTML=current.name+"（"+current.kana+"）は どこ？";$("hint").innerHTML=current.hero+"の ゆかりの地。青くかこまれた4つの城からえらぼう";$("answers").innerHTML="";
 var choices=[current.index],pool=[],i,v;for(i=0;i<PREFS.length;i++)if(PREFS[i].region===current.region&&i!==current.index)pool.push(i);
 while(choices.length<4){v=pool.length?pool[Math.floor(Math.random()*pool.length)]:Math.floor(Math.random()*PREFS.length);if(choices.indexOf(v)<0)choices.push(v)}
 shuffle(choices);var castles=document.getElementsByClassName("castle");
 for(i=0;i<castles.length;i++){var ci=parseInt(castles[i].getAttribute("data-i"),10);if(choices.indexOf(ci)>=0){castles[i].className+=" choice";castles[i].onclick=(function(ii){return function(){choosePlace(ii)}})(ci)}}
}
function makeAnswerButtons(vals,correct){
 var html='<div class="answerRow">',i;for(i=0;i<2;i++)html+='<div class="answerCell"><button class="answer" data-v="'+vals[i]+'">'+vals[i]+'</button></div>';
 html+='</div><div class="answerRow">';for(i=2;i<4;i++)html+='<div class="answerCell"><button class="answer" data-v="'+vals[i]+'">'+vals[i]+'</button></div></div>';$("answers").innerHTML=html;
 var bs=document.getElementsByClassName("answer");for(i=0;i<bs.length;i++)bs[i].onclick=function(){chooseName(this.getAttribute("data-v"),correct,this)};
}
function chooseName(v,correct,btn){if(locked)return;locked=true;if(v===correct){btn.style.background="#3f8f49";success()}else{btn.style.background="#777";combo=0;$("msg").innerHTML="おしい！ せいかいは「"+correct+"」<br>"+current.hero+"の ゆかりの地として いっしょに おぼえよう。";playMiss();setTimeout(function(){locked=false;nameFromPlace()},1200)}}
function choosePlace(i){if(locked)return;locked=true;if(i===current.index){success()}else{combo=0;$("msg").innerHTML="おしい！ "+current.name+"は 赤い城の場所だよ。<br>"+current.hero+"と いっしょに 場所をおぼえよう。";playMiss();setTimeout(function(){locked=false;render();placeFromName()},1200)}}
function success(){
 combo++;score+=100+combo*10;if(cleared.indexOf(current.index)<0)cleared.push(current.index);render();fireworks(35);playHit();
 $("clearText").innerHTML=current.name+"（"+current.kana+"）を せいは！<br><b>"+current.hero+"</b><br>"+current.fact+"<br><br>"+current.region+"地方　"+cleared.length+" / 47 せいは！";
 $("clear").style.display="block";save();
}
function nextQ(){$("clear").style.display="none";idx++;startQuestion();save()}

/* simple original pixel portraits by role, not likenesses */
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function drawPortrait(type){
 var cv=$("portraitCanvas"),c=cv.getContext("2d");c.clearRect(0,0,72,72);c.imageSmoothingEnabled=false;
 var skin="#e2b184",hair="#2b211b",robe="#355a7a",acc="#d4a72c";
 px(c,20,10,32,30,skin);px(c,18,8,36,10,hair);px(c,22,3,28,8,hair);px(c,25,22,5,4,"#111");px(c,43,22,5,4,"#111");px(c,31,33,11,3,"#7a3d2a");
 if(type==="warlord"||type==="samurai"||type==="lord"){robe=type==="warlord"?"#8b1e1e":"#34495e";px(c,14,40,44,27,robe);px(c,17,4,38,6,acc);px(c,22,0,7,7,acc);px(c,44,0,7,7,acc);px(c,9,42,8,22,robe);px(c,57,42,8,22,robe)}
 else if(type==="scholar"||type==="writer"||type==="poet"){robe="#425b73";px(c,14,40,44,27,robe);px(c,15,8,42,4,"#111");px(c,10,44,12,4,"#d8c8a4");px(c,52,44,12,4,"#d8c8a4")}
 else if(type==="artist"){robe="#6b4f7d";px(c,14,40,44,27,robe);px(c,58,35,4,27,"#c9a56c");px(c,62,35,4,12,"#333")}
 else if(type==="explorer"){robe="#506f4e";px(c,14,40,44,27,robe);px(c,14,8,44,6,"#8b6b35");px(c,55,42,5,24,"#8b6b35")}
 else if(type==="merchant"){robe="#7a5b2d";px(c,14,40,44,27,robe);px(c,13,9,46,5,"#333")}
 else if(type==="monk"){robe="#8a6a31";px(c,14,40,44,27,robe);px(c,22,5,28,6,"#d9b36c");px(c,60,38,3,28,"#8b5a2b")}
 else if(type==="king"||type==="prince"){robe="#6e3b7c";px(c,14,40,44,27,robe);px(c,18,3,36,7,"#e3bc38");px(c,25,0,5,6,"#e3bc38");px(c,42,0,5,6,"#e3bc38")}
 else{px(c,14,40,44,27,robe)}
}
/* audio */
function getAudio(){if(audioCtx)return audioCtx;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{audioCtx=new AC()}catch(e){audioCtx=null}return audioCtx}
function unlockAudio(){var a=getAudio();if(!a)return;try{if(a.state==="suspended"&&a.resume)a.resume();var b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}
function tone(f,st,d,v,t){var a=getAudio(),o,g;if(!a)return;try{o=a.createOscillator();g=a.createGain();o.type=t||"square";o.frequency.value=f;g.gain.setValueAtTime(v,st);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+d+.02)}catch(e){}}
function playHit(){if(!soundOn)return;var a=getAudio();if(a){tone(650,a.currentTime,.08,.045,"square");tone(980,a.currentTime+.08,.1,.04,"square")}}
function playMiss(){if(!soundOn)return;var a=getAudio();if(a)tone(150,a.currentTime,.15,.05,"sawtooth")}
function playWin(){if(!soundOn)return;var a=getAudio(),N=[523,659,784,1046],i;if(a)for(i=0;i<N.length;i++)tone(N[i],a.currentTime+i*.1,.18,.05,"square")}
function bgmTick(){var a=getAudio(),m=[220,261.63,293.66,329.63,293.66,261.63,246.94,220,196,246.94,293.66,392,329.63,293.66,261.63,246.94],b=[110,110,123.47,123.47,146.83,146.83,123.47,123.47],now;if(!a||!bgmOn)return;now=a.currentTime+.03;tone(m[bgmStep%m.length],now,.18,.016,"square");if(bgmStep%2===0)tone(b[Math.floor(bgmStep/2)%b.length],now,.32,.01,"triangle");bgmStep++}
function startBgm(){unlockAudio();bgmOn=true;if(bgmTimer)clearInterval(bgmTimer);bgmStep=0;bgmTick();bgmTimer=setInterval(bgmTick,270);render()}
function stopBgm(){bgmOn=false;if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}render()}
function toggleBgm(){if(bgmOn)stopBgm();else startBgm()}
function fireworks(n){var fx=$("fx"),cx=window.innerWidth/2,cy=window.innerHeight*.25,C=["#f66","#fd4","#5b7","#48e","#a6e"],i,e;for(i=0;i<n;i++){e=document.createElement("div");e.className="spark";e.style.background=C[i%5];e.style.left=cx+"px";e.style.top=cy+"px";fx.appendChild(e);(function(el,dx,dy,born){var tm=setInterval(function(){var t=((new Date()).getTime()-born)/900;if(t>=1){clearInterval(tm);if(el.parentNode)el.parentNode.removeChild(el);return}el.style.left=(cx+dx*t)+"px";el.style.top=(cy+dy*t)+"px";el.style.opacity=String(1-t)},30)})(e,Math.random()*600-300,80+Math.random()*400,(new Date()).getTime())}}

$("next").onclick=nextQ;$("again").onclick=function(){newOrder();idx=0;cleared=[];score=0;combo=0;$("allclear").style.display="none";startQuestion();save()};
$("restart").onclick=function(){unlockAudio();if(confirm("さいしょから やりなおしますか？")){newOrder();idx=0;cleared=[];score=0;combo=0;startQuestion();save()}};
$("sound").onclick=function(){unlockAudio();soundOn=!soundOn;render()};$("bgm").onclick=function(){unlockAudio();toggleBgm()};
load();startQuestion();
})();
